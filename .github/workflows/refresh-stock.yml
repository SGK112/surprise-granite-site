name: refresh-stock

# Keeps published product availability in step with the vendor's stock list.
#
# A customer called about a vanity the marketplace showed as available; ALFI had
# discontinued it. The page generator now cross-checks ALFI's published file,
# which found 66 products across five categories advertised in stock that the
# vendor reports as ZERO.
#
# That check decays in BOTH directions if nothing re-runs it:
#   - stale one way, we advertise something the vendor has run out of;
#   - stale the other way, a product that came BACK stays hidden — and nobody
#     reports that one, because a customer who cannot find a product does not
#     phone to say so.
#
# ALFI refreshes Mon/Wed/Fri, so this runs those afternoons: 14:00 America/
# Phoenix = 21:00 UTC (Arizona does not observe DST, so the offset is fixed).
#
# scripts/refresh-stock.js refuses to publish if the vendor file is unreachable
# or comes back short — republishing without it would put every pulled product
# back on the site as available, and would look like a successful run. It also
# commits nothing when nothing changed, so a quiet week leaves no history.

on:
  schedule:
    - cron: '0 21 * * 1,3,5'   # Mon/Wed/Fri 14:00 America/Phoenix
  workflow_dispatch: {}         # manual "refresh now" from the Actions tab
  repository_dispatch:
    types: [refresh-stock]      # lets the CRM trigger it after a vendor sync

concurrency:
  group: publish-pages          # shared with refresh-reviews: both rewrite the
  cancel-in-progress: false     # same product pages and must never race

permissions:
  contents: write               # commit + push regenerated pages

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Refresh availability from the vendor stock list (commit + push if changed)
        run: npm run refresh-stock:commit
